name: Publish to PyPI

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  release-build:
    name: Build Release Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Distribution
        run: uv build

      - name: Validate Package Version Matches Release Tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -c '
          import os, sys, zipfile
          from pathlib import Path

          def normalize(v: str) -> str:
              v = v.strip()
              if v.lower().startswith("v"):
                  v = v[1:]
              return v.strip()

          whls = list(Path("dist").glob("*.whl"))
          version = None
          if whls:
              with zipfile.ZipFile(whls[0]) as z:
                  for name in z.namelist():
                      if name.endswith(".dist-info/METADATA"):
                          for line in z.read(name).decode("utf-8").splitlines():
                              if line.startswith("Version: "):
                                  version = line.split(":", 1)[1].strip()
                                  break
                          break
              if not version:
                  version = whls[0].name.split("-")[1]

          if not version:
              sys.exit("Error: Could not determine built package version from dist/")

          tag_name = os.environ.get("RELEASE_TAG", "")
          norm_version = normalize(version)
          norm_tag = normalize(tag_name)

          print(f"Built package version: {version} (normalized: {norm_version}), Release tag: {tag_name} (normalized: {norm_tag})")

          if norm_version != norm_tag:
              print(f"::error::Built package version '\''{version}'\'' does not match release tag '\''{tag_name}'\''")
              sys.exit(1)
          '

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    needs:
      - release-build

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Notify Slack - Published to PyPI
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🐍 *Project Tree* version ${{ github.event.release.tag_name }} successfully published to PyPI."
            }
