name: Update Changelog on Merge

on:
  # Use pull_request_target to run with write permissions for fork PRs while checking out the base branch only.
  pull_request_target:
    types: [closed]
    branches:
      - main
      - master

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect commit information
        id: collect_commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          echo "Collecting commits for PR #${PR_NUMBER}..."

          # Fetch all commits in this PR
          COMMITS_JSON=$(gh api repos/${REPO}/pulls/${PR_NUMBER}/commits --paginate)

          # Fetch changed files
          FILES_JSON=$(gh api repos/${REPO}/pulls/${PR_NUMBER}/files --paginate)

          SUMMARY_BLOCK=""

          append_file_category() {
            local category_title="$1"
            local jq_filter="$2"
            local sentence_prefix="$3"

            local count
            count=$(echo "$FILES_JSON" | jq "$jq_filter | length")
            if [ "$count" -gt 0 ]; then
              local sample_files
              sample_files=$(echo "$FILES_JSON" | jq -r "$jq_filter | map(\"\`\(.filename)\`\")[:3] | join(\", \")")
              SUMMARY_BLOCK="${SUMMARY_BLOCK}* **${category_title}**"$'\n'
              SUMMARY_BLOCK="${SUMMARY_BLOCK}  * ${sentence_prefix} ${count} file(s)"
              if [ -n "$sample_files" ]; then
                SUMMARY_BLOCK="${SUMMARY_BLOCK}: ${sample_files}"
              fi
              SUMMARY_BLOCK="${SUMMARY_BLOCK}."$'\n\n'
            fi
          }

          OLD_VERSION=$(git diff "${BASE_SHA}" "${MERGE_COMMIT_SHA}" -- pyproject.toml | sed -nE "s/^-version = \"([^\"]+)\"/\1/p" | head -1)
          NEW_VERSION=$(git diff "${BASE_SHA}" "${MERGE_COMMIT_SHA}" -- pyproject.toml | sed -nE "s/^\+version = \"([^\"]+)\"/\1/p" | head -1)
          if [ -n "$OLD_VERSION" ] && [ -n "$NEW_VERSION" ] && [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            SUMMARY_BLOCK="${SUMMARY_BLOCK}* **Release**"$'\n'
            SUMMARY_BLOCK="${SUMMARY_BLOCK}  * Updated the project version from ${OLD_VERSION} to ${NEW_VERSION}."$'\n\n'
          fi

          append_file_category "Automation" \
            '[.[] | select(.filename | startswith(".github/"))]' \
            "Updated automation and workflow assets across"
          append_file_category "Quality Improvements" \
            '[.[] | select((.filename | startswith("projtree/")) or (.filename | startswith("tests/")))]' \
            "Improved source and test coverage across"
          append_file_category "Documentation" \
            '[.[] | select(.filename | endswith(".md"))]' \
            "Refined documentation across"
          append_file_category "Project Configuration" \
            '[.[] | select(.filename == "pyproject.toml" or .filename == "uv.lock" or .filename == ".gitignore" or .filename == ".projtreeignore")]' \
            "Adjusted project configuration in"

          HIGHLIGHTS=$(echo "$COMMITS_JSON" | jq -r '.[].commit.message | split("\n")[0]' | sed '/^\s*$/d' | head -3)
          if [ -n "$HIGHLIGHTS" ]; then
            SUMMARY_BLOCK="${SUMMARY_BLOCK}* **Highlights**"$'\n'
            while IFS= read -r line; do
              SUMMARY_BLOCK="${SUMMARY_BLOCK}  * ${line}"$'\n'
            done <<< "$HIGHLIGHTS"
            SUMMARY_BLOCK="${SUMMARY_BLOCK}"$'\n'
          fi

          if [ -z "$SUMMARY_BLOCK" ]; then
            SUMMARY_BLOCK="* **Summary**"$'\n'"  * Merged PR #${PR_NUMBER} with tracked repository updates."$'\n\n'
          fi

          # Write to temp file to avoid shell escaping issues
          # Format the merged-at timestamp (GitHub Actions always runs on Ubuntu/GNU coreutils)
          MERGED_AT_FORMATTED=$(date -u -d "${PR_MERGED_AT}" '+%Y-%m-%d %H:%M:%S UTC')
          COMPARE_URL="https://github.com/${REPO}/compare/${BASE_SHA}...${MERGE_COMMIT_SHA}"

          {
            printf '## %s — PR #%s: %s\n' "${MERGED_AT_FORMATTED}" "${PR_NUMBER}" "${PR_TITLE//%/%%}"
            echo ""
            echo "**Author:** @${PR_AUTHOR}  "
            echo "**Merge commit:** \`${MERGE_COMMIT_SHA}\`  "
            echo "**Merged at:** ${PR_MERGED_AT}"
            echo ""
            echo "### Summary"
            echo ""
            echo "${SUMMARY_BLOCK}"
            echo "Full changelog: ${COMPARE_URL}"
            echo ""
            echo "---"
            echo ""
          } > /tmp/new_entry.md

          echo "New changelog entry:"
          cat /tmp/new_entry.md

      - name: Prepend entry to CHANGELOG.md
        run: |
          CHANGELOG="CHANGELOG.md"

          if [ ! -f "$CHANGELOG" ]; then
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes merged to \`main\` or \`master\` are recorded here."
              echo "Entries are prepended automatically when a pull request is approved and merged."
              echo ""
              echo "---"
              echo ""
            } > "$CHANGELOG"
          fi

          # Insert the new entry after the header block (after the first '---' separator)
          HEADER_END=$(grep -n "^---$" "$CHANGELOG" | head -1 | cut -d: -f1)

          if [ -n "$HEADER_END" ]; then
            HEAD_LINES=$((HEADER_END))
            head -n "$HEAD_LINES" "$CHANGELOG" > /tmp/changelog_head.md
            tail -n +"$((HEAD_LINES + 1))" "$CHANGELOG" > /tmp/changelog_tail.md
            {
              cat /tmp/changelog_head.md
              echo ""
              cat /tmp/new_entry.md
              cat /tmp/changelog_tail.md
            } > "$CHANGELOG"
          else
            # No separator found – prepend the new entry before any existing content
            cat /tmp/new_entry.md "$CHANGELOG" > /tmp/changelog_merged.md
            mv /tmp/changelog_merged.md "$CHANGELOG"
          fi

          echo "Updated CHANGELOG.md:"
          cat "$CHANGELOG"

      - name: Commit and push changelog update
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update changelog for PR #${PR_NUMBER} — ${PR_TITLE}"
            for attempt in 1 2 3; do
              if git push origin "${TARGET_BRANCH}"; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push failed (attempt ${attempt}). Fetching latest and retrying..."
              git fetch origin "${TARGET_BRANCH}"
              if ! git rebase "origin/${TARGET_BRANCH}"; then
                echo "Rebase failed; aborting retry loop."
                git rebase --abort
                exit 1
              fi
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi
