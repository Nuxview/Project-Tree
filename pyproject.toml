[project]
name = "project-tree"
version = "1.3.2"
description = "Generate a deterministic Markdown representation of a project directory tree"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cli", "directory", "markdown", "project", "tree"]
dependencies = [
  "watchdog>=5.0.0",
]

authors = [
  { name = "Nuxview", email = "nuxview24@gmail.com" },
]

license = "MIT"

classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/Nuxview/Project-Tree"
Issues = "https://github.com/Nuxview/Project-Tree/issues"

[project.scripts]
projtree = "projtree.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"

[tool.setuptools.packages.find]
include = ["projtree*"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
